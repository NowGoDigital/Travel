<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMS Visual — Al-Barokah Travel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="data.js"></script>
<style>
/* ==================== RESET & VARIABEL (SAMA PERSIS DENGAN WEBSITE) ==================== */
:root{
  --hijau:#0c7a54; --hijau-tua:#064e35; --hijau-gelap:#042f21;
  --hijau-muda:#eaf6f0; --emas:#d4a94e; --emas-muda:#f3e3bd;
  --teks:#16211c; --teks-2:#5f6f68; --bg:#f7faf8; --putih:#fff;
  --radius:20px; --shadow:0 8px 30px rgba(4,47,33,.08);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#f0f4f2;color:var(--teks);line-height:1.6}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:.9rem;padding:10px 14px;border:1.5px solid #dfe9e4;border-radius:12px;width:100%;background:#fbfdfc;transition:.2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--hijau);box-shadow:0 0 0 4px rgba(12,122,84,.1)}
label{display:block;font-size:.78rem;font-weight:700;color:var(--hijau-tua);margin:12px 0 5px}
.hint{font-size:.7rem;color:var(--teks-2);margin-top:4px}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:none;border-radius:12px;padding:10px 20px;font-weight:700;font-size:.85rem;transition:.25s;text-decoration:none}
.btn-gold{background:linear-gradient(135deg,#e8c268,var(--emas));color:#3d2e08}
.btn-hijau{background:var(--hijau);color:#fff}
.btn-ghost{background:#fff;border:1.5px solid #dfe9e4;color:var(--teks)}
.btn-bahaya{background:#fff;border:1.5px solid #fdecea;color:#c0392b}
.btn-sm{padding:6px 12px;font-size:.76rem;border-radius:8px}

/* LOGIN */
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--hijau-gelap),var(--hijau-tua))}
.login-card{background:#fff;border-radius:24px;padding:40px;width:100%;max-width:400px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.login-card h1{font-family:'Playfair Display',serif;color:var(--hijau-gelap);margin-bottom:20px}

/* APP LAYOUT */
#app{display:none;min-height:100vh}
#app.active{display:flex}
aside{width:240px;background:var(--hijau-gelap);color:#fff;position:sticky;top:0;height:100vh;flex-shrink:0;display:flex;flex-direction:column}
aside .brand{padding:24px;font-family:'Playfair Display',serif;font-size:1.2rem;border-bottom:1px solid rgba(255,255,255,.1)}
aside nav{padding:20px 10px;flex:1}
aside nav button{width:100%;text-align:left;background:none;border:none;color:#cfe3d9;padding:12px 16px;border-radius:12px;margin-bottom:4px;font-size:.9rem;font-weight:600}
aside nav button:hover{background:rgba(255,255,255,.1);color:#fff}
aside nav button.active{background:var(--emas);color:#3d2e08;font-weight:800}
aside .foot{padding:20px;border-top:1px solid rgba(255,255,255,.1)}
aside .foot a{color:#fff;text-decoration:none;display:block;text-align:center;font-size:.85rem}

main{flex:1;padding:0}
.topbar{background:#fff;padding:16px 30px;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.topbar h2{font-family:'Playfair Display',serif;color:var(--hijau-gelap)}
.chip{padding:6px 12px;border-radius:99px;font-size:.75rem;font-weight:800}
.chip-ok{background:#e8f8ee;color:#0c7a54}
.chip-warn{background:#fff4e0;color:#a97613}

.content{padding:30px;max-width:1400px;margin:0 auto}

/* VISUAL CARD STYLES (MIMIC WEBSITE EXACTLY) */
.grid-paket{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:24px}
.card-cms{background:#fff;border-radius:24px;overflow:hidden;box-shadow:var(--shadow);position:relative;border:1px solid #eef3f0;transition:.3s}
.card-cms:hover{transform:translateY(-5px);box-shadow:0 15px 40px rgba(4,47,33,.15)}

/* Overlay Actions for Cards */
.card-actions-overlay{position:absolute;top:10px;right:10px;z-index:20;display:flex;gap:8px;opacity:0;transition:.3s}
.card-cms:hover .card-actions-overlay{opacity:1}
.act-btn{width:36px;height:36px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;font-size:1rem;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.2);transition:.2s}
.act-edit{background:#fff;color:var(--hijau)}
.act-edit:hover{background:var(--hijau);color:#fff}
.act-del{background:#fff;color:#c0392b}
.act-del:hover{background:#c0392b;color:#fff}

/* Card Inner Mimicry */
.c-img{height:200px;position:relative;background:#eee}
.c-img img{width:100%;height:100%;object-fit:cover}
.c-badge{position:absolute;top:12px;left:12px;background:rgba(255,255,255,.9);color:#065f46;padding:4px 10px;border-radius:99px;font-size:.7rem;font-weight:800}
.c-price{width:90%;margin:-20px auto 0;position:relative;z-index:2;background:linear-gradient(135deg,#f2d492,var(--emas));color:#3d2e08;border-radius:12px;padding:8px 14px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 10px rgba(212,169,78,.3)}
.c-price b{font-family:'Playfair Display',serif;font-size:1.1rem}
.c-body{padding:16px 20px 20px}
.c-body h3{font-family:'Playfair Display',serif;font-size:1.1rem;color:var(--hijau-gelap);margin-bottom:8px;line-height:1.3}
.c-meta{font-size:.75rem;color:var(--teks-2);display:flex;gap:8px;flex-wrap:wrap}
.c-meta span{background:#f6faf8;padding:4px 8px;border-radius:6px}

/* Generic List Grid */
.grid-generic{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.item-generic{background:#fff;padding:20px;border-radius:16px;box-shadow:var(--shadow);position:relative;border:1px solid #eee}
.item-generic:hover{border-color:var(--emas)}
.item-generic .g-actions{position:absolute;top:10px;right:10px;display:flex;gap:5px}

/* MODAL EDITOR */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(4,30,20,.6);backdrop-filter:blur(4px);z-index:100;align-items:center;justify-content:center;padding:20px}
.modal-bg.active{display:flex}
.modal{background:#fff;border-radius:24px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;padding:30px;position:relative}
.modal-close{position:absolute;top:15px;right:15px;width:32px;height:32px;border-radius:50%;border:none;background:#f0f0f0;font-size:1.2rem}
.modal h3{font-family:'Playfair Display',serif;color:var(--hijau-gelap);margin-bottom:20px}
.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:768px){.modal-grid{grid-template-columns:1fr}}

#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--hijau-gelap);color:#fff;padding:12px 24px;border-radius:99px;font-size:.85rem;font-weight:700;z-index:200;opacity:0;transition:.3s;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(-10px)}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-card">
    <h1>🕋 CMS Visual</h1>
    <p style="color:var(--teks-2);margin-bottom:20px">Kelola konten dengan tampilan asli website</p>
    <input type="password" id="inPass" placeholder="Kata Sandi Admin" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn btn-hijau" style="width:100%;margin-top:15px" onclick="doLogin()">Masuk</button>
    <p class="hint">Default: admin123</p>
  </div>
</div>

<!-- APP -->
<div id="app">
  <aside>
    <div class="brand">Al-Barokah <small style="display:block;font-size:.7rem;opacity:.7;font-family:sans-serif">CMS Panel</small></div>
    <nav id="sideNav"></nav>
    <div class="foot">
      <a href="index.html" target="_blank">🌐 Lihat Website</a>
      <button onclick="logout()" style="width:100%;background:none;border:none;color:#ffcccc;margin-top:10px;cursor:pointer">🚪 Keluar</button>
    </div>
  </aside>
  <main>
    <div class="topbar">
      <h2 id="topTitle">Dashboard</h2>
      <div style="display:flex;gap:10px;align-items:center">
        <span class="chip chip-ok" id="pubChip">✓ Sinkron</span>
        <button class="btn btn-gold btn-sm" onclick="unduhData()">🚀 Unduh data.js</button>
      </div>
    </div>
    <div class="content" id="host"></div>
  </main>
</div>

<!-- MODAL EDITOR -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <button class="modal-close" onclick="tutupModal()">×</button>
    <h3 id="modalTitle">Edit Data</h3>
    <div id="modalForm"></div>
    <div style="margin-top:20px;text-align:right">
      <button class="btn btn-ghost" onclick="tutupModal()">Batal</button>
      <button class="btn btn-hijau" id="btnSimpan">💾 Simpan</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ================================================================
   LOGIKA CMS VISUAL
================================================================ */
const LS_DRAFT='ab_cms_draft', LS_PASS='ab_cms_pass', SS_AUTH='ab_cms_auth';
let DB=null, viewAktif='dashboard', editCtx=null;

// Helper
const clone=o=>JSON.parse(JSON.stringify(o));
const rp=n=>'Rp '+(+n||0).toLocaleString('id-ID');
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
const lines=s=>String(s||'').split('\n').map(x=>x.trim()).filter(Boolean);
const nextId=()=>Date.now();

// Data Fallback
const FALLBACK={KONFIGURASI:{namaTravel:'Al-Barokah',nomorWA:'6281234567890'},SLIDES:[],PAKET:[],TESTIMONI:[],FAQ:[]};

async function muatData(){
  const draft=localStorage.getItem(LS_DRAFT);
  if(draft){try{DB=JSON.parse(draft);return;}catch(e){}}
  if(window.SITE_DATA){DB=clone(window.SITE_DATA);return;}
  DB=clone(FALLBACK);
}

function saveDraft(){localStorage.setItem(LS_DRAFT,JSON.stringify(DB));updateChip();}
function updateChip(){
  const ref=window.SITE_DATA||FALLBACK;
  const dirty=JSON.stringify(DB)!==JSON.stringify(ref);
  const chip=document.getElementById('pubChip');
  chip.className='chip '+(dirty?'chip-warn':'chip-ok');
  chip.textContent=dirty?'⚠️ Belum Publish':'✓ Sinkron';
}

/* AUTH */
const getPass=()=>localStorage.getItem(LS_PASS)||'admin123';
function doLogin(){
  if(document.getElementById('inPass').value===getPass()){sessionStorage.setItem(SS_AUTH,'1');masuk();}
  else alert('Sandi salah');
}
function logout(){sessionStorage.removeItem(SS_AUTH);location.reload();}
function masuk(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('app').classList.add('active');
  buildNav();show('dashboard');
}

/* NAVIGATION */
const MENU=[['dashboard',' Dashboard'],['paket','🕋 Semua Paket'],['slides','🖼️ Slide Hero'],['testimoni','💬 Testimoni'],['faq','❓ FAQ'],['identitas',' Identitas']];
function buildNav(){
  document.getElementById('sideNav').innerHTML=MENU.map(([k,l])=>`<button data-v="${k}" onclick="show('${k}')">${l}</button>`).join('');
}

function show(v){
  viewAktif=v;
  document.querySelectorAll('#sideNav button').forEach(b=>b.classList.toggle('active',b.dataset.v===v));
  document.getElementById('topTitle').textContent=MENU.find(m=>m[0]===v)[1].split(' ')[1];
  const host=document.getElementById('host');
  
  if(v==='dashboard') host.innerHTML=`<div style="text-align:center;padding:50px;color:var(--teks-2)">Selamat datang di CMS Visual. Pilih menu di sidebar untuk mulai mengedit konten secara langsung.</div>`;
  else if(v==='paket') host.innerHTML=vPaket();
  else if(v==='slides') host.innerHTML=vGeneric('slides');
  else if(v==='testimoni') host.innerHTML=vGeneric('testimoni');
  else if(v==='faq') host.innerHTML=vGeneric('faq');
  else if(v==='identitas') host.innerHTML=vIdentitas();
}

/* ================================================================
   RENDER VISUAL CARDS (PAKET)
================================================================ */
function vPaket(){
  const grid=DB.PAKET.map(p=>{
    const harga=p.hargaPromo||p.harga;
    return `
    <div class="card-cms">
      <div class="card-actions-overlay">
        <button class="act-btn act-edit" onclick="bukaEditor('paket',${p.id})" title="Edit">✏️</button>
        <button class="act-btn act-del" onclick="hapusItem('PAKET',${p.id})" title="Hapus">🗑</button>
      </div>
      <div class="c-img">
        <img src="${p.foto||'https://via.placeholder.com/400'}" alt="${p.nama}">
        <span class="c-badge">${p.status==='open'?'✅ Buka':'❌ Penuh'}</span>
      </div>
      <div class="c-price">
        <span>Mulai</span>
        <div><b>${rp(harga)}</b>${p.hargaPromo?`<s style="font-size:.7rem;margin-left:5px">${rp(p.harga)}</s>`:''}</div>
      </div>
      <div class="c-body">
        <h3>${p.nama}</h3>
        <div class="c-meta">
          <span>📅 ${p.durasi} Hari</span>
          <span>✈️ ${p.maskapai||'-'}</span>
          <span> ${p.hotelMakkah.bintang}⭐</span>
        </div>
      </div>
    </div>`;
  }).join('');

  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
      <h3 style="font-family:'Playfair Display',serif">Daftar Paket Umroh & Haji</h3>
      <button class="btn btn-hijau btn-sm" onclick="bukaEditor('paket',-1)"> Tambah Paket Baru</button>
    </div>
    <div class="grid-paket">${grid||'<div style="color:var(--teks-2)">Belum ada paket.</div>'}</div>
  `;
}

/* ================================================================
   RENDER GENERIC CARDS (Slides, Testimoni, etc)
================================================================ */
function vGeneric(type){
  const arr=DB[type.toUpperCase()]||DB[type]||[];
  const grid=arr.map((item,i)=>{
    let content='';
    let bg='';
    
    if(type==='slides'){
      bg=`background-image:url('${item.foto}');background-size:cover;height:150px;border-radius:12px 12px 0 0`;
      content=`<div style="padding:15px"><b>${item.judul}</b><br><small>${item.kicker}</small></div>`;
    } else if(type==='testimoni'){
      content=`<div style="font-style:italic;color:var(--teks-2);margin-bottom:10px">"${item.teks?.substring(0,80)}..."</div>
               <div style="font-weight:700;color:var(--hijau)">${item.nama} - ${item.kota}</div>`;
    } else {
      content=`<pre style="white-space:pre-wrap;font-size:.8rem">${JSON.stringify(item,null,2).substring(0,100)}...</pre>`;
    }

    return `
    <div class="item-generic">
      <div class="g-actions">
        <button class="act-btn act-edit" style="width:30px;height:30px;font-size:.8rem" onclick="bukaEditor('${type}',${i})">✏️</button>
        <button class="act-btn act-del" style="width:30px;height:30px;font-size:.8rem" onclick="hapusItem('${type.toUpperCase()}',${i})">🗑</button>
      </div>
      ${bg?`<div style="${bg}"></div>`:''}
      ${content}
    </div>`;
  }).join('');

  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
      <h3 style="font-family:'Playfair Display',serif">Daftar ${type.charAt(0).toUpperCase()+type.slice(1)}</h3>
      <button class="btn btn-hijau btn-sm" onclick="bukaEditor('${type}',-1)">➕ Tambah</button>
    </div>
    <div class="grid-generic">${grid||'<div style="color:var(--teks-2)">Kosong.</div>'}</div>
  `;
}

/* ================================================================
   EDITOR MODAL (DYNAMIC FORM)
================================================================ */
function bukaEditor(type, id){
  editCtx={type, id};
  const isNew=id===-1;
  let item=isNew?{}:(DB[type.toUpperCase()]||DB[type])[id];
  // Deep clone to avoid direct mutation before save
  item=clone(item);

  let form='';
  if(type==='paket'){
    form=`
      <div class="modal-grid">
        <div><label>Nama Paket</label><input id="e_nama" value="${esc(item.nama||'')}"></div>
        <div><label>Jenis</label><select id="e_jenis">
          <option value="umroh-reguler" ${item.jenis==='umroh-reguler'?'selected':''}>Umroh Reguler</option>
          <option value="umroh-vip" ${item.jenis==='umroh-vip'?'selected':''}>Umroh VIP</option>
          <option value="haji-khusus" ${item.jenis==='haji-khusus'?'selected':''}>Haji Khusus</option>
        </select></div>
        <div><label>Harga Normal</label><input type="number" id="e_harga" value="${item.harga||''}"></div>
        <div><label>Harga Promo</label><input type="number" id="e_promo" value="${item.hargaPromo||''}"></div>
        <div><label>Durasi (Hari)</label><input type="number" id="e_durasi" value="${item.durasi||''}"></div>
        <div><label>Tanggal Berangkat</label><input type="date" id="e_tgl" value="${item.tanggalBerangkat||''}"></div>
        <div><label>URL Foto</label><input id="e_foto" value="${esc(item.foto||'')}"></div>
        <div><label>Sisa Kuota</label><input type="number" id="e_sisa" value="${item.sisaKuota||0}"></div>
      </div>
      <div style="margin-top:15px"><label>Hotel Makkah (Nama | Bintang)</label>
        <div class="modal-grid">
          <input id="e_hm_nama" placeholder="Nama Hotel" value="${esc(item.hotelMakkah?.nama||'')}">
          <input type="number" id="e_hm_bintang" placeholder="Bintang" value="${item.hotelMakkah?.bintang||''}">
        </div>
      </div>
      <div style="margin-top:15px"><label>Fasilitas (Satu per baris)</label><textarea id="e_fas" rows="4">${(item.fasilitas||[]).join('\n')}</textarea></div>
    `;
  } else if(type==='slides'){
    form=`
      <div><label>URL Background</label><input id="e_foto" value="${esc(item.foto||'')}"></div>
      <div><label>Kicker Badge</label><input id="e_kicker" value="${esc(item.kicker||'')}"></div>
      <div><label>Judul Utama</label><input id="e_judul" value="${esc(item.judul||'')}"></div>
      <div><label>Subjudul</label><textarea id="e_sub" rows="3">${item.sub||''}</textarea></div>
    `;
  } else if(type==='testimoni'){
    form=`
      <div class="modal-grid">
        <div><label>Nama</label><input id="e_nama" value="${esc(item.nama||'')}"></div>
        <div><label>Kota</label><input id="e_kota" value="${esc(item.kota||'')}"></div>
      </div>
      <div><label>Inisial</label><input id="e_inisial" value="${esc(item.inisial||'')}" maxlength="2"></div>
      <div><label>Isi Testimoni</label><textarea id="e_teks" rows="4">${item.teks||''}</textarea></div>
    `;
  } else {
    form=`<div><label>Edit JSON Manual</label><textarea id="e_json" rows="10">${JSON.stringify(item,null,2)}</textarea></div>`;
  }

  document.getElementById('modalForm').innerHTML=form;
  document.getElementById('modalTitle').textContent=(isNew?'Tambah ':'Edit ')+type;
  document.getElementById('modalBg').classList.add('active');
  
  document.getElementById('btnSimpan').onclick=()=>simpanData(type);
}

function simpanData(type){
  const getVal=id=>document.getElementById(id)?.value||'';
  let newItem={};
  
  if(type==='paket'){
    newItem={
      id: editCtx.id===-1?nextId():editCtx.id,
      nama:getVal('e_nama'), jenis:getVal('e_jenis'), labelJenis:getVal('e_jenis'),
      foto:getVal('e_foto'), harga:+getVal('e_harga'), hargaPromo:+getVal('e_promo')||null,
      durasi:+getVal('e_durasi'), tanggalBerangkat:getVal('e_tgl'),
      hotelMakkah:{nama:getVal('e_hm_nama'),bintang:+getVal('e_hm_bintang')},
      sisaKuota:+getVal('e_sisa'), status:+getVal('e_sisa')>0?'open':'full',
      fasilitas:lines(getVal('e_fas')), itinerary:[], perlengkapan:[]
    };
  } else if(type==='slides'){
    newItem={foto:getVal('e_foto'),kicker:getVal('e_kicker'),judul:getVal('e_judul'),sub:getVal('e_sub'),cta1:{teks:'Lihat',href:'#'},cta2:{teks:'Chat',href:'#'}};
  } else if(type==='testimoni'){
    newItem={nama:getVal('e_nama'),kota:getVal('e_kota'),inisial:getVal('e_inisial'),teks:getVal('e_teks'),stars:'★★★★★'};
  } else {
    try{newItem=JSON.parse(getVal('e_json'));}catch(e){alert('Format JSON salah');return;}
  }

  const arr=DB[type.toUpperCase()]||DB[type];
  if(editCtx.id===-1) arr.push(newItem); else arr[editCtx.id]=newItem;
  
  saveDraft();
  tutupModal();
  show(viewAktif);
  toast('✅ Data disimpan ke draf');
}

function hapusItem(type, id){
  if(!confirm('Yakin hapus item ini?'))return;
  if(type==='PAKET') DB.PAKET=DB.PAKET.filter(p=>p.id!==id);
  else {
    const key=type.toLowerCase();
    const arr=DB[key.toUpperCase()]||DB[key];
    arr.splice(id,1);
  }
  saveDraft();
  show(viewAktif);
  toast('🗑 Item dihapus');
}

function tutupModal(){document.getElementById('modalBg').classList.remove('active');}

/* UTILS */
function unduhData(){
  const blob=new Blob(['window.SITE_DATA = '+JSON.stringify(DB,null,2)+';'],{type:'text/javascript'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='data.js';a.click();
  toast('🚀 data.js diunduh');
}
function vIdentitas(){

let toastTimer;
function toast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2500);
}

(async function init(){
  await muatData();
  if(sessionStorage.getItem(SS_AUTH)==='1')masuk();
