<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMS Admin — Al-Barokah Travel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="data.js"></script>
<style>
/* ==================== RESET & VARIABEL (SAMA DENGAN WEBSITE) ==================== */
:root{
  --hijau:#0c7a54; --hijau-tua:#064e35; --hijau-gelap:#042f21;
  --hijau-muda:#eaf6f0; --emas:#d4a94e; --emas-muda:#f3e3bd;
  --teks:#16211c; --teks-2:#5f6f68; --bg:#f4f8f6; --putih:#fff;
  --radius:20px; --shadow:0 8px 30px rgba(4,47,33,.08);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--teks);line-height:1.6;overflow-x:hidden}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:.9rem;padding:10px 14px;border:1.5px solid #dfe9e4;border-radius:12px;width:100%;background:#fbfdfc;transition:.2s;color:var(--teks)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--hijau);box-shadow:0 0 0 4px rgba(12,122,84,.1)}
label{display:block;font-size:.78rem;font-weight:700;color:var(--hijau-tua);margin:12px 0 5px}
.hint{font-size:.7rem;color:var(--teks-2);margin-top:4px}

/* ==================== UTILS & BUTTONS ==================== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:none;border-radius:12px;padding:10px 20px;font-weight:700;font-size:.85rem;transition:.25s;text-decoration:none}
.btn-gold{background:linear-gradient(135deg,#e8c268,var(--emas));color:#3d2e08}
.btn-gold:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(212,169,78,.4)}
.btn-hijau{background:var(--hijau);color:#fff}
.btn-hijau:hover{background:var(--hijau-tua)}
.btn-ghost{background:#fff;border:1.5px solid #dfe9e4;color:var(--teks)}
.btn-ghost:hover{border-color:var(--hijau);color:var(--hijau)}
.btn-bahaya{background:#fdecea;color:#c0392b}
.btn-bahaya:hover{background:#f8d7da}
.btn-sm{padding:6px 12px;font-size:.76rem;border-radius:8px}
.badge{display:inline-block;padding:4px 10px;border-radius:99px;font-size:.7rem;font-weight:800;letter-spacing:.5px}

/* ==================== LAYOUT CMS ==================== */
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--hijau-gelap),var(--hijau-tua));padding:20px}
.login-card{background:#fff;border-radius:24px;padding:42px 38px;width:100%;max-width:400px;text-align:center;box-shadow:0 30px 70px rgba(0,0,0,.35)}
.login-card .logo{font-size:3rem;margin-bottom:10px}
.login-card h1{font-size:1.4rem;color:var(--hijau-gelap);margin-bottom:8px;font-family:'Playfair Display',serif}
.login-card p{font-size:.85rem;color:var(--teks-2);margin-bottom:20px}

#app{display:none;min-height:100vh}
#app.active{display:flex}

/* SIDEBAR */
aside{width:260px;flex-shrink:0;background:var(--hijau-gelap);color:#cfe3d9;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:50}
aside .brand{padding:24px 22px;font-weight:800;color:#fff;font-size:1.1rem;border-bottom:1px solid rgba(255,255,255,.08);font-family:'Playfair Display',serif}
aside .brand small{display:block;font-weight:600;color:var(--emas);font-size:.7rem;letter-spacing:2px;text-transform:uppercase;font-family:'Plus Jakarta Sans',sans-serif;margin-top:4px}
aside nav{padding:16px 12px;flex:1}
aside nav button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:none;color:#cfe3d9;padding:12px 16px;border-radius:12px;font-size:.9rem;font-weight:600;margin-bottom:4px;transition:.2s}
aside nav button:hover{background:rgba(255,255,255,.07);color:#fff}
aside nav button.active{background:linear-gradient(135deg,#e8c268,var(--emas));color:#3d2e08;font-weight:800;box-shadow:0 4px 12px rgba(0,0,0,.2)}
aside .side-foot{padding:20px;border-top:1px solid rgba(255,255,255,.08)}
aside .side-foot a, aside .side-foot button{width:100%;margin-bottom:8px}

/* MAIN CONTENT */
main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-bottom:1px solid #e6efe9;padding:16px 28px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.topbar h2{font-size:1.2rem;color:var(--hijau-gelap);margin-right:auto;font-family:'Playfair Display',serif}
.chip{font-size:.75rem;font-weight:800;padding:6px 14px;border-radius:99px}
.chip-ok{background:#e8f8ee;color:#0c7a54;border:1px solid #c6ebd8}
.chip-warn{background:#fff4e0;color:#a97613;border:1px solid #ffe0b2}

.content{padding:28px;max-width:1400px;margin:0 auto;width:100%}

/* EDITOR GRID (FORM + PREVIEW) */
.editor-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}
@media(max-width:1024px){.editor-grid{grid-template-columns:1fr}}

.card-form{background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:28px}
.card-form h3{font-size:1rem;color:var(--hijau-gelap);margin-bottom:20px;display:flex;align-items:center;gap:8px;font-family:'Playfair Display',serif}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}

/* PREVIEW AREA STYLES (MIMIC WEBSITE) */
.preview-area{position:sticky;top:100px}
.preview-label{font-size:.8rem;font-weight:800;color:var(--teks-2);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;display:block}

/* Mimic Website Components for Preview */
.pv-card{background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 8px 30px rgba(4,47,33,.08);border:1px solid #eef3f0;font-family:'Plus Jakarta Sans',sans-serif}
.pv-card-img{height:200px;position:relative;background:#eee}
.pv-card-img img{width:100%;height:100%;object-fit:cover}
.pv-badge{position:absolute;top:12px;left:12px;background:rgba(255,255,255,.9);color:#065f46;padding:4px 10px;border-radius:99px;font-size:.7rem;font-weight:800}
.pv-price-float{width:90%;margin:-20px auto 0;position:relative;z-index:2;background:linear-gradient(135deg,#f2d492,var(--emas));color:#3d2e08;border-radius:12px;padding:8px 14px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 10px rgba(212,169,78,.3)}
.pv-price-float b{font-family:'Playfair Display',serif;font-size:1.1rem}
.pv-price-float s{font-size:.7rem;opacity:.7;margin-left:6px}
.pv-body{padding:16px 20px 20px}
.pv-body h3{font-size:1.1rem;color:var(--hijau-gelap);margin-bottom:8px;font-family:'Playfair Display',serif;line-height:1.3}
.pv-meta{display:flex;gap:10px;font-size:.75rem;color:var(--teks-2);margin-bottom:12px}
.pv-meta span{background:#f6faf8;padding:4px 8px;border-radius:6px}

.pv-testi{background:#fff;border-radius:20px;padding:24px;box-shadow:0 8px 30px rgba(4,47,33,.08);border:1px solid #eef3f0}
.pv-testi .stars{color:var(--emas);margin-bottom:10px}
.pv-testi p{font-style:italic;color:var(--teks-2);font-size:.9rem;margin-bottom:16px}
.pv-who{display:flex;align-items:center;gap:12px}
.pv-avatar{width:40px;height:40px;border-radius:50%;background:var(--hijau-muda);color:var(--hijau);display:flex;align-items:center;justify-content:center;font-weight:800}
.pv-who b{display:block;font-size:.9rem;color:var(--hijau-gelap)}
.pv-who small{color:var(--teks-2);font-size:.75rem}

.pv-slide{height:300px;border-radius:18px;overflow:hidden;position:relative;background-size:cover;background-position:center;margin-bottom:10px}
.pv-slide-overlay{position:absolute;inset:0;background:linear-gradient(transparent,rgba(0,0,0,.6))}
.pv-slide-content{position:absolute;bottom:20px;left:20px;right:20px;color:#fff}
.pv-slide-kicker{background:rgba(255,255,255,.2);padding:4px 10px;border-radius:99px;font-size:.7rem;font-weight:800;display:inline-block;margin-bottom:8px}
.pv-slide h2{font-family:'Playfair Display',serif;font-size:1.5rem;line-height:1.2;margin-bottom:8px}
.pv-slide p{font-size:.85rem;opacity:.9}

/* LIST VIEW TABLE */
.list-table{width:100%;border-collapse:collapse;font-size:.85rem;background:#fff;border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.list-table th{text-align:left;font-size:.75rem;text-transform:uppercase;color:var(--teks-2);padding:14px 18px;border-bottom:1px solid #eef3f0;background:#fbfdfc}
.list-table td{padding:14px 18px;border-bottom:1px solid #f0f5f2;vertical-align:middle}
.list-table tr:last-child td{border-bottom:none}
.list-table tr:hover td{background:#fafdfb}
.thumb-sm{width:48px;height:32px;object-fit:cover;border-radius:6px}
.empty-state{text-align:center;padding:40px;color:var(--teks-2)}

/* TOAST */
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--hijau-gelap);color:#fff;padding:12px 24px;border-radius:99px;font-size:.85rem;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.3);transition:.35s;z-index:200;opacity:0}
#toast.show{transform:translateX(-50%);opacity:1}

@media(max-width:900px){
  #app.active{flex-direction:column}
  aside{width:100%;height:auto;position:static;flex-direction:row;align-items:center;padding:10px;overflow-x:auto}
  aside .brand{display:none}
  aside nav{display:flex;padding:0;gap:8px}
  aside nav button{width:auto;white-space:nowrap;padding:8px 12px;font-size:.8rem}
  aside .side-foot{display:none}
  .content{padding:16px}
  .grid2{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-card">
    <div class="logo">🕋</div>
    <h1>CMS Al-Barokah</h1>
    <p>Panel Pengelolaan Konten Website</p>
    <label>Kata Sandi Admin</label>
    <input type="password" id="inPass" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn btn-hijau" style="width:100%;margin-top:16px" onclick="doLogin()">🔐 Masuk Dashboard</button>
    <div class="hint" style="margin-top:12px">Sandi default: <b>admin123</b></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <aside>
    <div class="brand">🕋 Al-Barokah<small>Admin Panel</small></div>
    <nav id="sideNav"></nav>
    <div class="side-foot">
      <a href="index.html" target="_blank" class="btn btn-ghost btn-sm">🌐 Lihat Website</a>
      <button class="btn btn-ghost btn-sm" onclick="logout()">🚪 Keluar</button>
    </div>
  </aside>
  <main>
    <div class="topbar">
      <h2 id="topTitle">Dashboard</h2>
      <span class="chip chip-ok" id="pubChip">✓ Sinkron</span>
      <button class="btn btn-ghost btn-sm" onclick="salinData()">📋 Salin data.js</button>
      <button class="btn btn-gold btn-sm" onclick="unduhData()">🚀 Unduh data.js</button>
    </div>
    <div class="content" id="host"></div>
  </main>
</div>

<div id="toast"></div>

<script>
/* ================================================================
   KONFIGURASI & DATA
================================================================ */
const LS_DRAFT='ab_cms_draft', LS_PASS='ab_cms_pass', SS_AUTH='ab_cms_auth';
let DB=null, BASELINE=null, viewAktif='dashboard', editCtx=null, saveTimer=null;

const LABEL_JENIS={'umroh-reguler':'Umroh Reguler','umroh-plus':'Umroh Plus','umroh-vip':'Umroh VIP','haji-khusus':'Haji Khusus'};
const FALLBACK={KONFIGURASI:{namaTravel:'Al-Barokah Travel',nomorWA:'6281234567890',pesanWADefault:'Assalamu\'alaikum.',alamat:'-',telepon:'-',email:'-',jamOperasional:'-',izinKemenag:'-',sosmed:{facebook:'#',instagram:'#',youtube:'#',tiktok:'#'}},SLIDES:[],PAKET:[],ALUR:[],GALERI:[],TESTIMONI:[],ARTIKEL:[],FAQ:[]};

// Helper
const clone=o=>JSON.parse(JSON.stringify(o));
const rp=n=>'Rp '+(+n||0).toLocaleString('id-ID');
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const lines=s=>String(s||'').split('\n').map(x=>x.trim()).filter(Boolean);
const nextPaketId=()=>(DB.PAKET.reduce((m,p)=>Math.max(m,p.id||0),0)+1);

/* ================================================================
   MUAT DATA
================================================================ */
async function muatData(){
  const draft=localStorage.getItem(LS_DRAFT);
  if(draft){try{DB=JSON.parse(draft);BASELINE=window.SITE_DATA?clone(window.SITE_DATA):null;return;}catch(e){}}
  if(window.SITE_DATA){DB=clone(window.SITE_DATA);BASELINE=clone(window.SITE_DATA);return;}
  // Fallback jika fetch gagal atau CORS
  BASELINE=clone(FALLBACK);DB=clone(FALLBACK);
}
function saveDraft(){localStorage.setItem(LS_DRAFT,JSON.stringify(DB));updateChip();}
function saveDraftDebounced(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{saveDraft();toast('💾 Draf tersimpan');},500);}
function updateChip(){
  const chip=document.getElementById('pubChip');
  const ref=window.SITE_DATA||BASELINE;
  const dirty=JSON.stringify(DB)!==JSON.stringify(ref);
  chip.className='chip '+(dirty?'chip-warn':'chip-ok');
  chip.textContent=dirty?'⚠️ Ada perubahan belum publish':'✓ Sinkron dengan website';
}

/* ================================================================
   AUTH
================================================================ */
const getPass=()=>localStorage.getItem(LS_PASS)||'admin123';
function doLogin(){
  if(document.getElementById('inPass').value===getPass()){sessionStorage.setItem(SS_AUTH,'1');masuk();}
  else toast('❌ Sandi salah!');
}
function logout(){sessionStorage.removeItem(SS_AUTH);location.reload();}
function masuk(){document.getElementById('loginScreen').style.display='none';document.getElementById('app').classList.add('active');buildNav();show('dashboard');}

/* ================================================================
   NAVIGASI
================================================================ */
const MENU=[['dashboard','📊','Dashboard'],['identitas','🏢','Identitas'],...Object.keys(LABEL_JENIS).map(k=>['paket-'+k,LABEL_JENIS[k].split(' ')[1]||'Paket','Daftar '+LABEL_JENIS[k]]),['slides','🖼️','Slide Hero'],['alur','🛤️','Alur Daftar'],['galeri','','Galeri'],['testimoni','','Testimoni'],['artikel','📰','Artikel'],['faq','❓','FAQ'],['pengaturan','⚙️','Pengaturan']];

function buildNav(){
  document.getElementById('sideNav').innerHTML=MENU.map(([k,i,l])=>`<button data-v="${k}" onclick="show('${k}')">${i} ${l}</button>`).join('');
}

function show(v){
  viewAktif=v;
  document.querySelectorAll('#sideNav button').forEach(b=>b.classList.toggle('active',b.dataset.v===v));
  const label=MENU.find(m=>m[0]===v);
  document.getElementById('topTitle').textContent=label?label[2]:'Edit Data';
  const host=document.getElementById('host');
  
  if(v==='dashboard') host.innerHTML=vDashboard();
  else if(v==='identitas') {host.innerHTML=vIdentitas();isiIdentitas();}
  else if(v==='pengaturan') host.innerHTML=vPengaturan();
  else if(v.startsWith('paket-')) {
    const jenis=v.split('-')[1];
    host.innerHTML=vListPaket(jenis);
  }
  else if(v==='slides') host.innerHTML=vListGeneric('slides');
  else if(v==='alur') host.innerHTML=vListGeneric('alur');
  else if(v==='galeri') host.innerHTML=vListGeneric('galeri');
  else if(v==='testimoni') host.innerHTML=vListGeneric('testimoni');
  else if(v==='artikel') host.innerHTML=vListGeneric('artikel');
  else if(v==='faq') host.innerHTML=vListGeneric('faq');
  
  updateChip();
}

/* ================================================================
   VIEW: DASHBOARD
================================================================ */
function vDashboard(){
  return `
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;margin-bottom:24px">
    <div style="background:#fff;padding:20px;border-radius:16px;box-shadow:var(--shadow)">
      <div style="font-size:2rem">🕋</div><b>${DB.PAKET.length}</b><div style="font-size:.8rem;color:var(--teks-2)">Total Paket</div>
    </div>
    <div style="background:#fff;padding:20px;border-radius:16px;box-shadow:var(--shadow)">
      <div style="font-size:2rem">🖼️</div><b>${DB.SLIDES.length}</b><div style="font-size:.8rem;color:var(--teks-2)">Slide Hero</div>
    </div>
    <div style="background:#fff;padding:20px;border-radius:16px;box-shadow:var(--shadow)">
      <div style="font-size:2rem">💬</div><b>${DB.TESTIMONI.length}</b><div style="font-size:.8rem;color:var(--teks-2)">Testimoni</div>
    </div>
  </div>
  <div style="background:#fff;padding:24px;border-radius:18px;box-shadow:var(--shadow)">
    <h3 style="margin-bottom:12px;font-family:'Playfair Display',serif"> Cara Publish Perubahan</h3>
    <ol style="margin-left:20px;color:var(--teks-2);font-size:.9rem;line-height:1.8">
      <li>Edit konten melalui menu di sidebar. Perubahan tersimpan otomatis sebagai <b>Draf Lokal</b>.</li>
      <li>Klik tombol <b>🚀 Unduh data.js</b> di kanan atas.</li>
      <li>Upload file <b>data.js</b> tersebut ke hosting/GitHub Anda (sejajar dengan index.html).</li>
      <li>Tunggu ±1 menit, website live akan berubah sesuai editan Anda.</li>
    </ol>
  </div>`;
}

/* ================================================================
   VIEW: IDENTITAS
================================================================ */
function vIdentitas(){
  const fields=[
    ['namaTravel','Nama Travel'],['nomorWA','No. WhatsApp (62xxx)'],['alamat','Alamat Kantor'],
    ['telepon','Telepon'],['email','Email'],['jamOperasional','Jam Operasional'],
    ['izinKemenag','Teks Izin Kemenag'],['pesanWADefault','Pesan WA Default','textarea']
  ];
  return `<div class="card-form"><h3>🏢 Identitas & Kontak</h3>
    <div class="grid2">${fields.map(f=>`<div><label>${f[1]}</label>${f[2]==='textarea'?`<textarea id="id_${f[0]}" rows="2" oninput="identUbah('${f[0]}',this.value)"></textarea>`:`<input id="id_${f[0]}" oninput="identUbah('${f[0]}',this.value)">`}</div>`).join('')}</div>
    <p class="hint">Perubahan tersimpan otomatis.</p></div>`;
}
function isiIdentitas(){
  const keys=['namaTravel','nomorWA','alamat','telepon','email','jamOperasional','izinKemenag','pesanWADefault'];
  keys.forEach(k=>{const el=document.getElementById('id_'+k);if(el)el.value=DB.KONFIGURASI[k]??'';});
}
function identUbah(k,v){DB.KONFIGURASI[k]=v;saveDraftDebounced();}

/* ================================================================
   VIEW: LIST PAKET (DENGAN LIVE PREVIEW)
================================================================ */
function vListPaket(jenis){
  const arr=DB.PAKET.filter(p=>p.jenis===jenis);
  const rows=arr.map((p,i)=>`
    <tr>
      <td><img src="${p.foto||'https://via.placeholder.com/48'}" class="thumb-sm" alt=""></td>
      <td><b>${p.nama}</b><br><span style="font-size:.75rem;color:var(--teks-2)">${rp(p.hargaPromo||p.harga)}</span></td>
      <td>${p.sisaKuota} sisa</td>
      <td style="text-align:right">
        <button class="btn btn-ghost btn-sm" onclick="bukaEditorPaket(${p.id})">✏️ Edit</button>
        <button class="btn btn-bahaya btn-sm" onclick="hapusItem('PAKET',${p.id})"></button>
      </td>
    </tr>
  `).join('');
  
  return `
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
    <h3 style="font-family:'Playfair Display',serif">Daftar ${LABEL_JENIS[jenis]}</h3>
    <button class="btn btn-hijau btn-sm" onclick="bukaEditorPaket(-1,'${jenis}')">➕ Tambah Paket</button>
  </div>
  ${arr.length?`<table class="list-table"><thead><tr><th>Foto</th><th>Paket</th><th>Kuota</th><th>Aksi</th></tr></thead><tbody>${rows}</tbody></table>`:'<div class="empty-state">Belum ada paket. Klik "Tambah Paket" untuk membuat baru.</div>'}
  `;
}

/* ================================================================
   EDITOR PAKET (LIVE PREVIEW CARD)
================================================================ */
function bukaEditorPaket(id, jenisDefault='umroh-reguler'){
  const isNew=id===-1;
  const p=isNew?{id:nextPaketId(),nama:'',jenis:jenisDefault,harga:0,hargaPromo:'',durasi:10,tanggalBerangkat:'',maskapai:'',foto:'',hotelMakkah:{nama:'',bintang:4,jarak:''},hotelMadinah:{nama:'',bintang:4,jarak:''},kuota:40,sisaKuota:40,status:'open',fasilitas:[],perlengkapan:[],itinerary:[]}:DB.PAKET.find(x=>x.id===id);
  
  editCtx={type:'PAKET',id:p.id};
  
  // Generate Preview HTML
  const previewHTML=`
    <div class="pv-card">
      <div class="pv-card-img">
        <img src="${p.foto||'https://via.placeholder.com/400x200?text=Foto+Paket'}" id="prevImg">
        <span class="pv-badge">${p.status==='open'?'✅ Buka':'❌ Penuh'}</span>
      </div>
      <div class="pv-price-float">
        <span>Mulai dari</span>
        <div><b id="prevHarga">${rp(p.hargaPromo||p.harga)}</b>${p.hargaPromo?`<s id="prevCoret">${rp(p.harga)}</s>`:''}</div>
      </div>
      <div class="pv-body">
        <h3 id="prevNama">${p.nama||'Nama Paket...'}</h3>
        <div class="pv-meta">
          <span>📅 <span id="prevTgl">${p.tanggalBerangkat||'-'}</span></span>
          <span>✈️ <span id="prevMaskapai">${p.maskapai||'-'}</span></span>
        </div>
        <div style="font-size:.8rem;color:var(--teks-2);margin-top:8px">
          🕋 <span id="prevHM">${p.hotelMakkah.nama||'Hotel Makkah'}</span> ⭐${p.hotelMakkah.bintang}<br>
          🕌 <span id="prevHD">${p.hotelMadinah.nama||'Hotel Madinah'}</span> ⭐${p.hotelMadinah.bintang}
        </div>
      </div>
    </div>
  `;

  document.getElementById('host').innerHTML=`
    <div class="editor-grid">
      <!-- FORM -->
      <div class="card-form">
        <h3>${isNew?'➕ Tambah':'️ Edit'} Paket</h3>
        <div class="grid2">
          <div><label>Nama Paket</label><input id="eNama" value="${esc(p.nama)}" oninput="updPrev()"></div>
          <div><label>Jenis</label><select id="eJenis" onchange="show(viewAktif)">${Object.entries(LABEL_JENIS).map(([k,v])=>`<option value="${k}" ${p.jenis===k?'selected':''}>${v}</option>`).join('')}</select></div>
        </div>
        <div class="grid2">
          <div><label>Harga Normal (Rp)</label><input type="number" id="eHarga" value="${p.harga}" oninput="updPrev()"></div>
          <div><label>Harga Promo (Rp)</label><input type="number" id="eHargaPromo" value="${p.hargaPromo||''}" oninput="updPrev()"></div>
        </div>
        <div class="grid2">
          <div><label>Durasi (Hari)</label><input type="number" id="eDurasi" value="${p.durasi}"></div>
          <div><label>Tanggal Berangkat</label><input type="date" id="eTgl" value="${p.tanggalBerangkat}" oninput="updPrev()"></div>
        </div>
        <div><label>URL Foto Utama</label><input id="eFoto" value="${esc(p.foto)}" oninput="updPrev()" placeholder="https://..."></div>
        
        <h4 style="margin-top:20px;font-size:.9rem;color:var(--hijau)">🏨 Akomodasi</h4>
        <div class="grid2">
          <div><label>Hotel Makkah</label><input id="eHM" value="${esc(p.hotelMakkah.nama)}" oninput="updPrev()"></div>
          <div><label>Bintang</label><input type="number" id="eHMB" value="${p.hotelMakkah.bintang}" min="1" max="5"></div>
        </div>
        <div class="grid2">
          <div><label>Hotel Madinah</label><input id="eHD" value="${esc(p.hotelMadinah.nama)}" oninput="updPrev()"></div>
          <div><label>Bintang</label><input type="number" id="eHDB" value="${p.hotelMadinah.bintang}" min="1" max="5"></div>
        </div>

        <h4 style="margin-top:20px;font-size:.9rem;color:var(--hijau)"> Detail Lain</h4>
        <div class="grid2">
          <div><label>Total Kuota</label><input type="number" id="eKuota" value="${p.kuota}"></div>
          <div><label>Sisa Kuota</label><input type="number" id="eSisa" value="${p.sisaKuota}"></div>
        </div>
        <div><label>Status</label><select id="eStatus"><option value="open" ${p.status==='open'?'selected':''}>Pendaftaran Dibuka</option><option value="full" ${p.status==='full'?'selected':''}>Kuota Habis</option></select></div>
        
        <div><label>Fasilitas (Satu per baris)</label><textarea id="eFas" rows="4">${(p.fasilitas||[]).join('\n')}</textarea></div>
        <div><label>Itinerary (Format: Hari | Judul | Ket)</label><textarea id="eItin" rows="5">${(p.itinerary||[]).map(i=>`${i.hari} | ${i.judul} | ${i.ket}`).join('\n')}</textarea></div>

        <div style="margin-top:24px;display:flex;gap:10px">
          <button class="btn btn-ghost" onclick="show('paket-${p.jenis}')">Batal</button>
          <button class="btn btn-hijau" onclick="simpanPaket()">💾 Simpan Perubahan</button>
        </div>
      </div>

      <!-- LIVE PREVIEW -->
      <div class="preview-area">
        <span class="preview-label">Tampilan di Website (Live Preview)</span>
        ${previewHTML}
      </div>
    </div>
  `;
}

function updPrev(){
  const getVal=id=>document.getElementById(id)?.value||'';
  const harga=+getVal('eHarga')||0;
  const promo=+getVal('eHargaPromo')||0;
  
  document.getElementById('prevNama').textContent=getVal('eNama')||'Nama Paket...';
  document.getElementById('prevHarga').textContent=rp(promo||harga);
  document.getElementById('prevTgl').textContent=getVal('eTgl')||'-';
  document.getElementById('prevMaskapai').textContent=getVal('eMaskapai')||'-'; // Note: Maskapai field missing in form above, add if needed or ignore
  document.getElementById('prevHM').textContent=getVal('eHM')||'Hotel Makkah';
  document.getElementById('prevHD').textContent=getVal('eHD')||'Hotel Madinah';
  
  const img=document.getElementById('prevImg');
  const url=getVal('eFoto');
  if(url) img.src=url;
  
  const coret=document.getElementById('prevCoret');
  if(coret) coret.style.display=promo?'inline':'none';
}

function simpanPaket(){
  const getVal=id=>document.getElementById(id)?.value||'';
  const p={
    id:editCtx.id,
    nama:getVal('eNama'),
    jenis:getVal('eJenis'),
    labelJenis:LABEL_JENIS[getVal('eJenis')],
    foto:getVal('eFoto'),
    harga:+getVal('eHarga')||0,
    hargaPromo:+getVal('eHargaPromo')||null,
    durasi:+getVal('eDurasi')||0,
    tanggalBerangkat:getVal('eTgl'),
    maskapai:'-', // Simplified for this demo
    hotelMakkah:{nama:getVal('eHM'),bintang:+getVal('eHMB')||4,jarak:''},
    hotelMadinah:{nama:getVal('eHD'),bintang:+getVal('eHDB')||4,jarak:''},
    kuota:+getVal('eKuota')||0,
    sisaKuota:+getVal('eSisa')||0,
    status:getVal('eStatus'),
    fasilitas:lines(getVal('eFas')),
    perlengkapan:[],
    itinerary:lines(getVal('eItin')).map(l=>{const x=l.split('|');return{hari:+x[0]||0,judul:x[1]?.trim()||'',ket:x[2]?.trim()||''};})
  };
  
  const idx=DB.PAKET.findIndex(x=>x.id===p.id);
  if(idx>-1) DB.PAKET[idx]=p; else DB.PAKET.push(p);
  
  saveDraft();
  toast('✅ Paket berhasil disimpan ke draf');
  show('paket-'+p.jenis);
}

/* ================================================================
   VIEW: GENERIC LIST (Slides, Testimoni, etc)
================================================================ */
function vListGeneric(key){
  const arr=DB[key.toUpperCase()]||DB[key]; // Handle case sensitivity
  if(!arr) return '<div>Data not found</div>';
  
  const rows=arr.map((item,i)=>{
    let sub='';
    if(key==='slides') sub=item.judul;
    else if(key==='testimoni') sub=item.nama+' - '+item.kota;
    else if(key=='artikel') sub=item.judul;
    else if(key=='faq') sub=item.q;
    else sub=JSON.stringify(item).slice(0,50)+'...';
    
    return `<tr>
      <td>${sub}</td>
      <td style="text-align:right">
        <button class="btn btn-ghost btn-sm" onclick="bukaEditorGeneric('${key}',${i})">✏️ Edit</button>
        <button class="btn btn-bahaya btn-sm" onclick="hapusItemGeneric('${key}',${i})">🗑</button>
      </td>
    </tr>`;
  }).join('');

  return `
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
    <h3 style="font-family:'Playfair Display',serif">Daftar ${key.charAt(0).toUpperCase()+key.slice(1)}</h3>
    <button class="btn btn-hijau btn-sm" onclick="bukaEditorGeneric('${key}',-1)">➕ Tambah</button>
  </div>
  <table class="list-table"><thead><tr><th>Konten</th><th style="width:120px">Aksi</th></tr></thead><tbody>${rows}</tbody></table>
  `;
}

/* ================================================================
   EDITOR GENERIC (Simple Form)
================================================================ */
function bukaEditorGeneric(key, idx){
  const arr=DB[key.toUpperCase()]||DB[key];
  const item=idx>-1?arr[idx]:{};
  editCtx={type:key.toUpperCase()?key.toUpperCase():key, id:idx};
  
  // Simple dynamic form based on key
  let formHTML='';
  if(key==='slides'){
    formHTML=`
      <div><label>URL Background</label><input id="g_foto" value="${item.foto||''}"></div>
      <div><label>Kicker Badge</label><input id="g_kicker" value="${item.kicker||''}"></div>
      <div><label>Judul Utama</label><input id="g_judul" value="${item.judul||''}"></div>
      <div><label>Subjudul</label><textarea id="g_sub" rows="3">${item.sub||''}</textarea></div>
    `;
  } else if(key==='testimoni'){
    formHTML=`
      <div><label>Nama Jamaah</label><input id="g_nama" value="${item.nama||''}"></div>
      <div><label>Kota</label><input id="g_kota" value="${item.kota||''}"></div>
      <div><label>Inisial (2 Huruf)</label><input id="g_inisial" value="${item.inisial||''}" maxlength="2"></div>
      <div><label>Isi Testimoni</label><textarea id="g_teks" rows="4">${item.teks||''}</textarea></div>
    `;
  } else {
    formHTML=`<div><label>Data JSON (Advanced)</label><textarea id="g_json" rows="10">${JSON.stringify(item,null,2)}</textarea><p class="hint">Edit manual jika field tidak tersedia.</p></div>`;
  }

  document.getElementById('host').innerHTML=`
    <div class="editor-grid">
      <div class="card-form">
        <h3>${idx>-1?'✏️ Edit':'➕ Tambah'} ${key}</h3>
        ${formHTML}
        <div style="margin-top:20px;display:flex;gap:10px">
          <button class="btn btn-ghost" onclick="show('${key}')">Batal</button>
          <button class="btn btn-hijau" onclick="simpanGeneric('${key}')"> Simpan</button>
        </div>
      </div>
      <div class="preview-area">
        <span class="preview-label">Preview Sederhana</span>
        <div style="background:#fff;padding:20px;border-radius:12px;box-shadow:var(--shadow)">
          <pre style="font-size:.8rem;color:var(--teks-2);white-space:pre-wrap" id="prevJson">${JSON.stringify(item,null,2)}</pre>
        </div>
      </div>
    </div>
  `;
}

function simpanGeneric(key){
  const arr=DB[key.toUpperCase()]||DB[key];
  const idx=editCtx.id;
  let newItem={};
  
  if(key==='slides'){
    newItem={foto:document.getElementById('g_foto').value,kicker:document.getElementById('g_kicker').value,judul:document.getElementById('g_judul').value,sub:document.getElementById('g_sub').value,cta1:{teks:'Lihat Paket',href:'#paket',style:'btn-gold'},cta2:{teks:'Konsultasi',href:'#daftar',style:'btn-ghost'}};
  } else if(key==='testimoni'){
    newItem={nama:document.getElementById('g_nama').value,kota:document.getElementById('g_kota').value,inisial:document.getElementById('g_inisial').value,teks:document.getElementById('g_teks').value,paket:'-',stars:'★★★★★'};
  } else {
    try{newItem=JSON.parse(document.getElementById('g_json').value);}catch(e){alert('JSON Error');return;}
  }
  
  if(idx>-1) arr[idx]=newItem; else arr.push(newItem);
  saveDraft();
  toast('✅ Disimpan');
  show(key);
}

/* ================================================================
   UTILS & DELETE
================================================================ */
function hapusItem(type, id){
  if(!confirm('Hapus item ini?'))return;
  if(type==='PAKET') DB.PAKET=DB.PAKET.filter(p=>p.id!==id);
  saveDraft();
  show(viewAktif);
  toast('🗑 Item dihapus');
}
function hapusItemGeneric(key, idx){
  if(!confirm('Hapus item ini?'))return;
  const arr=DB[key.toUpperCase()]||DB[key];
  arr.splice(idx,1);
  saveDraft();
  show(key);
  toast('🗑 Item dihapus');
}

/* ================================================================
   PUBLISH & SETTINGS
================================================================ */
function unduhData(){
  const blob=new Blob(['window.SITE_DATA = '+JSON.stringify(DB,null,2)+';'],{type:'text/javascript'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='data.js';a.click();
  toast('🚀 data.js diunduh');
}
function salinData(){
  navigator.clipboard.writeText('window.SITE_DATA = '+JSON.stringify(DB,null,2)+';');
  toast('📋 Kode disalin');
}
function vPengaturan(){
  return `<div class="card-form"><h3>⚙️ Pengaturan</h3>
    <label>Ganti Sandi Admin</label>
    <div class="grid2">
      <input type="password" id="pLama" placeholder="Sandi Lama">
      <input type="password" id="pBaru" placeholder="Sandi Baru">
    </div>
    <button class="btn btn-hijau btn-sm" style="margin-top:12px" onclick="gantiPass()">Simpan Sandi</button>
    
    <h4 style="margin-top:24px">♻️ Reset Data</h4>
    <button class="btn btn-bahaya btn-sm" onclick="if(confirm('Reset semua draf ke default?')){localStorage.removeItem('${LS_DRAFT}');location.reload()}">Reset Draf Lokal</button>
  </div>`;
}
function gantiPass(){
  const l=document.getElementById('pLama').value,b=document.getElementById('pBaru').value;
  if(l!==getPass())return toast('Sandi lama salah');
  localStorage.setItem(LS_PASS,b);toast('Sandi diganti');
}

/* ================================================================
   INIT
================================================================ */
let toastTimer;
function toast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2600);
}

(async function init(){
  await muatData();
  if(sessionStorage.getItem(SS_AUTH)==='1')masuk();
})();
</script>
</body>
</html>
